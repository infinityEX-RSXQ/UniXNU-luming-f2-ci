name: os-volume-ls
on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "macOS runner label"
        required: true
        type: string
        default: "macos-15-intel"
permissions:
  contents: read
jobs:
  ls:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 30
    env:
      PRIVATE_REPOSITORY: infinityEX-RSXQ/luming-macos-prep
      PRIVATE_UPLOAD_TOKEN: ${{ secrets.PRIVATE_UPLOAD_TOKEN }}
      RELEASE_TAG: os-volume-ls
      IPSW_URL: https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw
    steps:
      - name: Download and attach OS
        run: |
          set -euo pipefail
          mkdir -p /tmp/osls
          cd /tmp/osls
          curl -fL --retry 5 --retry-all-errors "$IPSW_URL" -o restore.ipsw
          unzip -j restore.ipsw '044-76040-038.dmg'
          rm -f restore.ipsw
          hdiutil attach -readonly -noverify -nobrowse -mountpoint "$PWD/os" 044-76040-038.dmg
      - name: List OS paths
        run: |
          set -euo pipefail
          cd /tmp/osls
          OS="$PWD/os"
          {
            echo "### /System/Volumes"
            ls -la "$OS/System/Volumes" 2>&1 || true
            echo
            echo "### /System/Volumes/Data"
            ls -la "$OS/System/Volumes/Data" 2>&1 || true
            echo
            echo "### /private"
            ls -la "$OS/private" 2>&1 || true
            echo
            echo "### /private/var"
            ls -ld "$OS/private/var" 2>&1 || true
            ls -la "$OS/private/var" 2>&1 | head -100 || true
            echo
            echo "### /private/etc/fstab"
            ls -la "$OS/private/etc/fstab" 2>&1 || true
            cat "$OS/private/etc/fstab" 2>&1 || true
            echo
            echo "### /etc/fstab"
            ls -la "$OS/etc/fstab" 2>&1 || true
            cat "$OS/etc/fstab" 2>&1 || true
            echo
            echo "### /System/Library/Caches/com.apple.dyld"
            ls -la "$OS/System/Library/Caches/com.apple.dyld" 2>&1 | head -10 || true
            echo
            echo "### /System/Volumes/Data symlink target/stat"
            stat -f '%N %HT %Y -> %Y' "$OS/System/Volumes/Data" 2>&1 || true
            readlink "$OS/System/Volumes/Data" 2>&1 || true
          } | tee os-volume-ls.txt
          hdiutil detach "$OS"
      - name: Upload report
        run: |
          set -euo pipefail
          cd /tmp/osls
          export GH_TOKEN="$PRIVATE_UPLOAD_TOKEN"
          gh release view "$RELEASE_TAG" --repo "$PRIVATE_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --repo "$PRIVATE_REPOSITORY" \
                 --title "OS volume layout" \
                 --notes "ls -la of /System/Volumes, /private/var, fstab and dyld cache in the 21H461 OS image."
          gh release upload "$RELEASE_TAG" --repo "$PRIVATE_REPOSITORY" --clobber os-volume-ls.txt
      - name: Summary
        if: always()
        run: |
          cd /tmp/osls || exit 0
          { echo '### OS volume ls'; echo '```'; cat os-volume-ls.txt 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
