                      '_cdx13_publish_ui_scale', '_cdx13_capture_validity', '_cdx13_append_mode_summary',
                      '_cdx14_console_commit', '_cdx14_console_snapshot', '_cdx14_frame_begin',
                      '_cdx14_frame_end', '_cdx14_frame_gap', '_cdx14_after_release',
