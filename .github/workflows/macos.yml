          markers = {
              'cdx14_boot_args': [b'luming-display-vt-latch', b'luming-display-frame-probe',
                                  b'luming-display-snapshot'],
              'cdx14_registry_and_panic': [b'CDX14FrameSamples',
                                           b'CDX14 diagnostic snapshot (intentional)',
                                           b'f=%llu sampled=%u blank=%u valid=%u src=%llx dst=%llx'],
              'cdx14_log_lines': [b'CDX14 blank=%u', b'CDX14 f=%llu src=%llx dst=%llx',
                                  b'CDX14 eq=%u mutate=%u between=%u own=%u block=%u',
                                  b'CDX14 exit %.16s p=%d rv=%x ns=%u code=%llx n=%u',
                                  b'CDX14 exc %.16s e=%u c0=%llx c1=%llx'],
              'cdx13_regression': [b'CDX13 got=%u err=%d busy=%u', b'luming-display-ui-scale'],
          }
          absent = [token.decode('latin1') for group in markers.values()
                    for token in group if token not in data]
          if absent:
              raise SystemExit('missing kernel strings: ' + ', '.join(absent))
          # Device install report: the four deterministic stage14 outputs and the
          # stage13 -> stage14 source chain.
          expected = json.loads(Path('device/stage14/integration-validation.json')
                                .read_text(encoding='utf-8-sig'))
