name: apfs-dyld
on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: "Apple IPSW URL"
        required: true
        type: string
      release_tag:
        description: "Private release tag"
        required: true
        type: string
        default: "apfs-dyld-21H461-10g"
      runner_label:
        description: "macOS runner label"
        required: false
        type: string
        default: "macos-15"
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 180
    env:
      PRIVATE_REPOSITORY: infinityEX-RSXQ/luming-macos-prep
      PRIVATE_UPLOAD_TOKEN: ${{ secrets.PRIVATE_UPLOAD_TOKEN }}
      IPSW_URL: ${{ inputs.ipsw_url }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Disk before
        run: df -h /
      - name: Download IPSW
        run: |
          set -euo pipefail
          mkdir -p /tmp/apfs
          cd /tmp/apfs
          curl -fL --retry 5 --retry-all-errors "$IPSW_URL" -o restore.ipsw
          ls -lh restore.ipsw
      - name: Extract SystemOS and copy dyld cache
        run: |
          set -euo pipefail
          cd /tmp/apfs
          unzip -j restore.ipsw '044-76034-038.dmg'
          mkdir -p dyldcache
          hdiutil attach -readonly -nobrowse -mountpoint "$PWD/sysos" 044-76034-038.dmg
          find sysos -path '*com.apple.dyld*' -o -name 'dyld_shared_cache*' | tee /tmp/dyld-list.txt
          cache_dir=$(find sysos -type d -name 'com.apple.dyld' -print -quit)
          [ -n "$cache_dir" ] || { echo "::error::com.apple.dyld directory missing"; exit 1; }
          cp -a "$cache_dir"/. dyldcache/
          find dyldcache -type f -exec shasum -a 256 {} \; | tee /tmp/dyld-sha.txt
          du -sh dyldcache
          hdiutil detach "$PWD/sysos"
          rm -f 044-76034-038.dmg
          df -h /
      - name: Extract OS and convert to writable UDRW
        run: |
          set -euo pipefail
          cd /tmp/apfs
          unzip -j restore.ipsw '044-76040-038.dmg'
          rm -f restore.ipsw
          hdiutil convert -format UDRW -o os-rw.dmg 044-76040-038.dmg
          rm -f 044-76040-038.dmg
          ls -lh os-rw.dmg
          df -h /
      - name: Resize OS disk and APFS container to 10g
        run: |
          set -euo pipefail
          cd /tmp/apfs
          hdiutil resize -size 10g os-rw.dmg
          hdiutil attach -readwrite -nobrowse -nomount os-rw.dmg | tee /tmp/attach-nomount.txt
          DISK=$(awk '/\/dev\/disk/ {print $1; exit}' /tmp/attach-nomount.txt)
          PART="${DISK}s1"
          echo "DISK=$DISK PART=$PART"
          diskutil list "$DISK"
          resize_ok=0
          if diskutil apfs resizeContainer "$PART" 10g; then
            resize_ok=1
          else
            echo "explicit 10g resize failed; repairing GPT"
            printf 'y\n' | diskutil repairDisk "$DISK" || true
            if diskutil apfs resizeContainer "$PART" 0; then
              resize_ok=1
            else
              CONTAINER=$(diskutil list | awk '/Apple_APFS Container/ {print $NF; exit}')
              echo "trying container reference: $CONTAINER"
              if diskutil apfs resizeContainer "$CONTAINER" 0; then resize_ok=1; fi
            fi
          fi
          echo "resize_ok=$resize_ok"
          if [ "$resize_ok" != 1 ]; then
            diskutil apfs list || true
            df -h /
            echo "::error::APFS resizeContainer failed"
            exit 1
          fi
          diskutil apfs list | tee /tmp/apfs-list.txt
          df -h /
          hdiutil detach "$DISK" -force || true
          ls -lh os-rw.dmg
      - name: Mount expanded OS, copy cache
        run: |
          set -euo pipefail
          cd /tmp/apfs
          hdiutil attach -readwrite -nobrowse os-rw.dmg | tee /tmp/attach-rw.txt
          OSDISK=$(awk '/\/dev\/disk/ {print $1; exit}' /tmp/attach-rw.txt)
          echo "OSDISK=$OSDISK"
          OVOL=$(awk '/\/Volumes\// {print $3; exit}' /tmp/attach-rw.txt || true)
          if [ -z "${OVOL:-}" ]; then
            diskutil mount "$OSDISK"
            OVOL=$(df -h | awk '/\/Volumes\// {print $NF; exit}')
          fi
          echo "OVOL=$OVOL"
          df -h "$OVOL" | tee /tmp/df-osvol.txt
          mkdir -p "$OVOL/System/Library/Caches/com.apple.dyld"
          rsync -a --exclude='*.symbols' dyldcache/ "$OVOL/System/Library/Caches/com.apple.dyld/"
          find "$OVOL/System/Library/Caches/com.apple.dyld" -type f | wc -l
          du -sh "$OVOL/System/Library/Caches/com.apple.dyld"
          find "$OVOL/System/Library/Caches/com.apple.dyld" -maxdepth 1 -type f -exec shasum -a 256 {} \; | tee /tmp/copied-sha.txt
          sync
          hdiutil detach "$OSDISK"
          df -h /
      - name: Add Data and Preboot volumes inside the OS container
        run: |
          set -euo pipefail
          cd /tmp/apfs
          hdiutil attach -readwrite -nobrowse -nomount os-rw.dmg | tee /tmp/attach-roles.txt
          DISK=$(awk '/\/dev\/disk/ {print $1; exit}' /tmp/attach-roles.txt)
          echo "DISK=$DISK"
          CONTAINER=$(diskutil list "$DISK" | awk '/Apple_APFS Container/ {print $4; exit}')
          echo "CONTAINER=$CONTAINER"
          diskutil apfs list "$CONTAINER" | tee /tmp/apfs-before-roles.txt
          set +e
          diskutil apfs addVolume "$CONTAINER" APFS Data -role D 2>&1 | tee /tmp/add-data.txt
          diskutil apfs addVolume "$CONTAINER" APFS Preboot -role P 2>&1 | tee /tmp/add-preboot.txt
          set -e
          diskutil apfs list "$CONTAINER" | tee /tmp/apfs-list.txt
          if ! grep -q '(Data)' /tmp/apfs-list.txt; then echo "::error::Data role volume missing"; exit 1; fi
          if ! grep -q '(Preboot)' /tmp/apfs-list.txt; then echo "::error::Preboot role volume missing"; exit 1; fi
          hdiutil detach "$DISK" -force || true
          ls -lh os-rw.dmg
      - name: Export enlarged raw image
        run: |
          set -euo pipefail
          cd /tmp/apfs
          SZ=$(stat -f%z os-rw.dmg)
          DISKSIZE=$((SZ - 512))
          echo "os-rw.dmg size=$SZ  raw disk size=$DISKSIZE"
          DEV=$(hdiutil attach -readwrite -nobrowse -nomount os-rw.dmg | awk '/\/dev\/disk/ {print $1; exit}')
          RDEV=$(echo "$DEV" | sed 's#/dev/disk#/dev/rdisk#')
          echo "DEV=$DEV RDEV=$RDEV"
          sudo dd if="$RDEV" of=os-flat.img bs=1048576 count=$((DISKSIZE/1048576+1))
          sudo chown "$(id -u):$(id -g)" os-flat.img
          truncate -s "$DISKSIZE" os-flat.img
          stat -f%z os-flat.img | tee os-flat.size
          shasum -a 256 os-flat.img | tee os-flat.sha256
          hdiutil detach "$DEV"
          df -h /
      - name: gzip and split
        run: |
          set -euo pipefail
          cd /tmp/apfs
          gzip -1 -c os-flat.img > os-flat.img.gz
          rm -f os-flat.img
          ls -lh os-flat.img.gz
          if [ "$(stat -f%z os-flat.img.gz)" -gt 1992294400 ]; then
            split -b 1800m os-flat.img.gz os-flat.img.gz.part-
            rm -f os-flat.img.gz
          fi
          shasum -a 256 os-flat.img.gz* | tee os-flat.parts.sha256
          cp /tmp/apfs-list.txt apfs-list.txt
          cp /tmp/df-osvol.txt df-osvol.txt
          cp /tmp/dyld-list.txt dyld-list.txt
          cp /tmp/dyld-sha.txt dyld-sha.txt
          cp /tmp/copied-sha.txt copied-sha.txt
          ls -lh
      - name: Upload to private release
        run: |
          set -euo pipefail
          cd /tmp/apfs
          export GH_TOKEN="$PRIVATE_UPLOAD_TOKEN"
          gh release view "$RELEASE_TAG" --repo "$PRIVATE_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --repo "$PRIVATE_REPOSITORY" \
                 --title "APFS 10g OS raw $RELEASE_TAG" \
                 --notes "Expanded OS raw image with dyld shared cache in /System/Library/Caches/com.apple.dyld. Apple-derived; private."
          gh release upload "$RELEASE_TAG" --repo "$PRIVATE_REPOSITORY" --clobber \
            os-flat.img.gz* os-flat.size os-flat.sha256 os-flat.parts.sha256 \
            apfs-list.txt df-osvol.txt dyld-list.txt dyld-sha.txt copied-sha.txt
      - name: Summary
        if: always()
        run: |
          cd /tmp/apfs || exit 0
          {
            echo "### runner ${{ inputs.runner_label }}"
            echo '```'
            cat os-flat.size 2>/dev/null || true
            cat os-flat.sha256 2>/dev/null || true
            cat os-flat.parts.sha256 2>/dev/null || true
            cat /tmp/dyld-list.txt 2>/dev/null || true
            cat /tmp/dyld-sha.txt 2>/dev/null || true
            cat /tmp/df-osvol.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
