name: apfs-apsb-host
on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "macOS runner label"
        required: true
        type: string
        default: "macos-15-intel"
permissions:
  contents: read
jobs:
  dump:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 20
    env:
      PRIVATE_REPOSITORY: infinityEX-RSXQ/luming-macos-prep
      PRIVATE_UPLOAD_TOKEN: ${{ secrets.PRIVATE_UPLOAD_TOKEN }}
      RELEASE_TAG: apfs-apsb-host
    steps:
      - name: Disk list
        run: |
          set -euo pipefail
          diskutil list | tee /tmp/diskutil-list.txt
          df -h /
      - name: Read APFS container checkpoint region
        run: |
          set -euo pipefail
          # Find the Apple_APFS physical store on the boot disk
          PART=$(diskutil list | awk '/Apple_APFS/ {print $NF; exit}')
          echo "PART=$PART"
          [ -n "$PART" ] && [ "$PART" != null ] || { echo "::error::no Apple_APFS partition"; exit 1; }
          sudo dd if="/dev/r$PART" bs=1m count=512 2>/dev/null > /tmp/host-head.bin || \
            sudo dd if="/dev/$PART" bs=1048576 count=512 2>/dev/null > /tmp/host-head.bin
          ls -lh /tmp/host-head.bin
      - name: Scan APSB blocks
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/apsb-scan.txt
          import struct
          data = open('/tmp/host-head.bin', 'rb').read()
          BS = 4096
          M = 0xFFFFFFFF
          def fw(words, init):
              s1 = init & 0xFFFFFFFF
              s2 = (init >> 32) & 0xFFFFFFFF
              for w in words:
                  s1 = (s1 + w) & 0xFFFFFFFF
                  s2 = (s2 + s1) & 0xFFFFFFFF
              return ((s2 % M) << 32) | (s1 % M)
          def verify(b):
              words = struct.unpack('<%dI' % (len(b)//4), b)
              return fw(words[2:], 0) == 0
          best = {}
          for i in range(len(data)//BS):
              b = data[i*BS:(i+1)*BS]
              if b[32:36] != b'APSB':
                  continue
              ok = verify(b)
              xid = struct.unpack_from('<Q', b, 16)[0]
              uu = b[0xf0:0x100].hex()
              name = b[0x2c0:0x2c0+256].split(b'\x00')[0].decode('latin1', 'ignore')
              old = best.get(uu)
              if old is None or xid > old[0] or (xid == old[0] and ok and not old[2]):
                  best[uu] = (xid, name, ok, i, b)
          if not best:
              print('NO APSB FOUND')
              raise SystemExit(1)
          for uu, (xid, name, ok, i, b) in best.items():
              safe = ''.join(c if c.isalnum() or c in ' ._-' else '_' for c in name).strip().replace(' ', '_')
              path = '/tmp/apsb-' + (safe or uu) + '.bin'
              open(path, 'wb').write(b)
              print(uu, repr(name), 'xid', xid, 'off', hex(i*BS), 'verify', ok, 'path', path)
          # extra copies for System/Data names if verification filtered one out
          for i in range(len(data)//BS):
              b = data[i*BS:(i+1)*BS]
              if b[32:36] != b'APSB':
                  continue
              name = b[0x2c0:0x2c0+256].split(b'\x00')[0].decode('latin1', 'ignore')
              if 'Macintosh' in name:
                  safe = ''.join(c if c.isalnum() or c in ' ._-' else '_' for c in name).strip().replace(' ', '_')
                  path = '/tmp/copy-' + safe + '.bin'
                  if not __import__('os').path.exists(path):
                      open(path, 'wb').write(b)
                      print('extra copy', repr(name), path)
          PY
          ls -lh /tmp/apsb-* /tmp/copy-* 2>/dev/null || true
      - name: Upload APSB blocks
        run: |
          set -euo pipefail
          cp /tmp/diskutil-list.txt diskutil-list.txt
          cp /tmp/apsb-scan.txt apsb-scan.txt
          export GH_TOKEN="$PRIVATE_UPLOAD_TOKEN"
          gh release view "$RELEASE_TAG" --repo "$PRIVATE_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --repo "$PRIVATE_REPOSITORY" \
                 --title "host APFS APSB blocks" \
                 --notes "System and Data APSB copies from a real macOS volume group (for offline group-id patch)."
          gh release upload "$RELEASE_TAG" --repo "$PRIVATE_REPOSITORY" --clobber \
            apsb-scan.txt diskutil-list.txt /tmp/apsb-*.bin
      - name: Summary
        if: always()
        run: |
          { echo '### APSB scan'; echo '```'; cat /tmp/apsb-scan.txt 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
