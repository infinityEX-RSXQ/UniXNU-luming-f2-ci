name: cache-cdhash-all
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Private release tag"
        required: true
        type: string
        default: "cache-cdhashes-21H461"
      runner_label:
        description: "macOS runner label"
        required: true
        type: string
        default: "macos-15-intel"
permissions:
  contents: read
jobs:
  cdhashes:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 60
    env:
      PRIVATE_REPOSITORY: infinityEX-RSXQ/luming-macos-prep
      PRIVATE_UPLOAD_TOKEN: ${{ secrets.PRIVATE_UPLOAD_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      IPSW_URL: https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw
    steps:
      - name: Disk before
        run: df -h /
      - name: Download and attach SystemOS
        run: |
          set -euo pipefail
          mkdir -p /tmp/cdhashes
          cd /tmp/cdhashes
          curl -fL --retry 5 --retry-all-errors "$IPSW_URL" -o restore.ipsw
          unzip -j restore.ipsw '044-76034-038.dmg'
          rm -f restore.ipsw
          hdiutil attach -readonly -noverify -noautofsck -nobrowse -mountpoint "$PWD/sysos" 044-76034-038.dmg
          find "$PWD/sysos/System/Library/Caches/com.apple.dyld" -maxdepth 1 -type f -exec ls -l {} \; | tee cache-files.txt
      - name: Compute cdhash for every non-symbols cache file
        run: |
          set -euo pipefail
          cd /tmp/cdhashes
          python3 - <<'PY'
          import struct, hashlib, glob, os
          files = sorted(p for p in glob.glob('/tmp/cdhashes/sysos/System/Library/Caches/com.apple.dyld/*')
                         if os.path.isfile(p) and not p.endswith('.symbols'))
          plain = open('cache-cdhashes-all.txt', 'w')
          info = open('cache-files-all.txt', 'w')
          for path in files:
              name = os.path.basename(path)
              data = open(path, 'rb').read()
              size = len(data)
              sha = hashlib.sha256(data).hexdigest()
              info.write(f'{name} {size} {sha}\n')
              cdhash = 'NO_CD'
              hash_type = '-'
              flags = '-'
              try:
                  if data[:16].startswith(b'dyld_v1'):
                      cs_off, cs_size = struct.unpack_from('<QQ', data, 0x28)
                      if cs_off and cs_size and cs_off + cs_size <= size:
                          blob = data[cs_off:cs_off+cs_size]
                          magic2, length, count = struct.unpack_from('>III', blob, 0)
                          if magic2 == 0xfade0cc0 and length <= len(blob):
                              for i in range(count):
                                  btype, boff = struct.unpack_from('>II', blob, 12 + 8*i)
                                  bmagic, blen = struct.unpack_from('>II', blob, boff)
                                  if bmagic == 0xfade0c02 and boff + blen <= len(blob):
                                      cd = blob[boff:boff+blen]
                                      cdhash = hashlib.sha256(cd).hexdigest()[:40]
                                      hash_type = str(cd[37])
                                      flags = str(struct.unpack_from('>I', cd, 12)[0])
                                      break
              except Exception as exc:
                  cdhash = f'ERROR:{exc}'
              plain.write(f'{name} {cdhash} {hash_type} {flags}\n')
          plain.close()
          info.close()
          PY
          echo '== cache-cdhashes-all.txt =='
          cat cache-cdhashes-all.txt
          echo '== cache-files-all.txt =='
          cat cache-files-all.txt
          hdiutil detach "$PWD/sysos"
      - name: Upload text to private release
        run: |
          set -euo pipefail
          cd /tmp/cdhashes
          export GH_TOKEN="$PRIVATE_UPLOAD_TOKEN"
          gh release view "$RELEASE_TAG" --repo "$PRIVATE_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --repo "$PRIVATE_REPOSITORY" \
                 --title "dyld cache cdhashes $RELEASE_TAG" \
                 --notes "All non-symbols CodeDirectory cdhashes for the 21H461 SystemOS dyld shared cache."
          gh release upload "$RELEASE_TAG" --repo "$PRIVATE_REPOSITORY" --clobber \
            cache-cdhashes-all.txt cache-files-all.txt cache-files.txt
      - name: Summary
        if: always()
        run: |
          cd /tmp/cdhashes || exit 0
          { echo '### cache cdhashes'; echo '```'; cat cache-cdhashes-all.txt 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
