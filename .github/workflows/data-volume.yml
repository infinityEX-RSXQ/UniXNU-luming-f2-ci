name: data-volume
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Private release tag"
        required: true
        type: string
        default: "data-volume-21H461"
      runner_label:
        description: "macOS runner label"
        required: true
        type: string
        default: "macos-15-intel"
permissions:
  contents: read
jobs:
  data:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 60
    env:
      PRIVATE_REPOSITORY: infinityEX-RSXQ/luming-macos-prep
      PRIVATE_UPLOAD_TOKEN: ${{ secrets.PRIVATE_UPLOAD_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Disk before
        run: df -h /
      - name: Create APFS Data-role disk image
        run: |
          set -euo pipefail
          mkdir -p /tmp/data
          cd /tmp/data
          # 4 GiB so both UDRW and raw fit on the 14 GiB runner disk.
          hdiutil create -size 4g -layout GPTSPUD -fs APFS -volname Data -type UDIF -format UDRW -ov data.dmg
          hdiutil attach -readwrite -nobrowse -nomount data.dmg | tee attach.txt
          DEV=$(awk '/\/dev\/disk/ {print $1; exit}' attach.txt)
          echo "DEV=$DEV"
          diskutil list "$DEV" | tee disk-list-before.txt
          diskutil apfs list | tee apfs-list-before.txt
          CONTAINER=$(diskutil list "$DEV" | awk '/Apple_APFS Container/ {print $NF; exit}')
          echo "CONTAINER=${CONTAINER:-none}"
          if ! diskutil apfs list | grep -q 'Role:.*Data'; then
            echo "Data role not present; creating a Data-role volume"
            if [ -n "${CONTAINER:-}" ]; then
              diskutil apfs addVolume "$CONTAINER" APFS Data -role Data || true
            fi
          fi
          diskutil apfs list | tee apfs-list-after.txt
          if ! diskutil apfs list | grep -q 'Role:.*Data'; then
            echo "::warning::Data role still not set; will export GPT+APFS image as-is"
          fi
      - name: Export raw and gzip
        run: |
          set -euo pipefail
          cd /tmp/data
          DEV=$(awk '/\/dev\/disk/ {print $1; exit}' attach.txt)
          hdiutil detach "$DEV" || true
          SZ=$(stat -f%z data.dmg)
          DISKSIZE=$((SZ - 512))
          echo "data.dmg size=$SZ raw=$DISKSIZE"
          hdiutil attach -readwrite -nobrowse -nomount data.dmg | tee attach2.txt
          DEV=$(awk '/\/dev\/disk/ {print $1; exit}' attach2.txt)
          RDEV=$(echo "$DEV" | sed 's#/dev/disk#/dev/rdisk#')
          sudo dd if="$RDEV" of=data-flat.img bs=1048576 count=$((DISKSIZE/1048576+1))
          sudo chown "$(id -u):$(id -g)" data-flat.img
          truncate -s "$DISKSIZE" data-flat.img
          stat -f%z data-flat.img | tee data-flat.size
          shasum -a 256 data-flat.img | tee data-flat.sha256
          hdiutil detach "$DEV" || true
          gzip -1 -c data-flat.img > data-flat.img.gz
          rm -f data-flat.img
          ls -lh data-flat.img.gz
          shasum -a 256 data-flat.img.gz | tee data-flat.img.gz.sha256
          cp apfs-list-before.txt apfs-list.txt
          cp disk-list-before.txt disk-list.txt
      - name: Upload to private release
        run: |
          set -euo pipefail
          cd /tmp/data
          export GH_TOKEN="$PRIVATE_UPLOAD_TOKEN"
          gh release view "$RELEASE_TAG" --repo "$PRIVATE_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --repo "$PRIVATE_REPOSITORY" \
                 --title "Data-volume APFS disk $RELEASE_TAG" \
                 --notes "GPT+APFS disk with a Data-role volume for the format-2 luming userdata."
          gh release upload "$RELEASE_TAG" --repo "$PRIVATE_REPOSITORY" --clobber \
            data-flat.img.gz data-flat.size data-flat.sha256 data-flat.img.gz.sha256 \
            apfs-list.txt disk-list.txt
      - name: Summary
        if: always()
        run: |
          cd /tmp/data || exit 0
          { echo '### data volume'; echo '```'; cat apfs-list-before.txt 2>/dev/null || true; cat apfs-list-after.txt 2>/dev/null || true; cat data-flat.size 2>/dev/null || true; cat data-flat.sha256 2>/dev/null || true; cat data-flat.img.gz.sha256 2>/dev/null || true; ls -lh data-flat.img.gz 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
